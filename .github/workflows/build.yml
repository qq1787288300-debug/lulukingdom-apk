name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with official kivy/buildozer image
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD":/home/user/hostcwd \
            kivy/buildozer:latest android debug 2>&1 | tee buildozer.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lulukingdom-apk
          path: bin/*.apk
